<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Madridista 臥底純度檢測</title>
  
  <link rel="stylesheet" href="style.css">
  
  <!-- 🌟 把煙花庫移進 head 裡面，確保載入順序絕對正確 -->
  <script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.10.7/dist/index.umd.js"></script>
</head>
<body>

  <div class="header-text">
    查看球衣，檢測純度。
    <span>Spotify Camp Nou / 2026.10.26</span>
  </div>

  <figure class="reveal-hover" data-reveal-hover data-reveal-radius="200">
    <img class="reveal-hover__image reveal-hover__image--base" src="barca-bear.png" alt="Barca Bear" width="800" height="1067" />
    <img class="reveal-hover__image reveal-hover__image--overlay" src="madrid-bear.png" alt="Madrid Bear" width="800" height="1067" aria-hidden="true" />
  </figure>

  <div class="hint-container" id="secret-text">
    <div class="phase-1" id="phase-1">
      👆 噓，成功臥底。Hala Madrid 
      <span id="click-heart" style="cursor: pointer; pointer-events: auto;">🤍</span>
      <button id="reset-btn" class="reset-btn" aria-label="重新體驗">🔄</button>
    </div>
  </div>

  <div class="modal-overlay" id="oath-modal">
    <div class="modal-card">
      <h1 class="oath-text">樊振東，你真的很好。</h1>
    </div>
  </div>

  <script src="script.js"></script>
  <script type="module" src="gesture-fireworks.js"></script>
</body>
</html>
