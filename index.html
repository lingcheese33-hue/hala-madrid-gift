<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Madridista 臥底純度檢測</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header-text">
    查看球衣，檢測純度。
    <span>Spotify Camp Nou / 2026.10.26</span>
  </div>

  <!-- 互動卡片區域 -->
  <figure class="reveal-hover" data-reveal-hover data-reveal-radius="200">
    <img
      class="reveal-hover__image reveal-hover__image--base"
      src="barca-bear.png"
      alt="Barca Bear"
      width="800"
      height="1067"
    />
    <img
      class="reveal-hover__image reveal-hover__image--overlay"
      src="madrid-bear.png"
      alt=""
      width="800"
      height="1067"
      aria-hidden="true"
    />
  </figure>

<!-- 底部文字區域 -->
<div class="hint-container" id="secret-text">
  <!-- 🌟 只有這一句台詞，按鈕放在裡面 -->
  <div class="phase-1" id="phase-1">
    👆 噓，成功臥底。Hala Madrid 🤍
    <button id="reset-btn" class="reset-btn" aria-label="重新體驗">🔄</button>
  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
